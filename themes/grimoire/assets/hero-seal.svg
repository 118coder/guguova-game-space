<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 440" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="fiber" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#8d7448" opacity=".35"/>
    </pattern>
    <path id="seal" d="M150 96l12 8 14-4 6 13 14 2 2 14 13 6-4 14 8 12-8 12 4 14-13 6-2 14-14 2-6 13-14-4-12 8-12-8-14 4-6-13-14-2-2-14-13-6 4-14-8-12 8-12-4-14 13-6 2-14 14-2 6-13 14 4z"/>
  </defs>

  <rect width="300" height="440" fill="#efe2c4"/>
  <rect width="300" height="440" fill="url(#fiber)"/>

  <!-- double gold rule, top -->
  <g stroke="#b08d4f">
    <path d="M18 30h264" stroke-width="1.5"/>
    <path d="M18 35h264" stroke-width=".8"/>
  </g>

  <!-- corner filigree, top-left -->
  <g fill="none" stroke="#b08d4f" stroke-width="1.4">
    <path d="M18 30v34c0 10 8 18 18 18h10"/>
    <path d="M18 44c8 0 14 6 14 14s-6 14-14 14"/>
    <path d="M34 30c0 8 6 14 14 14s14-6 14-14"/>
    <circle cx="32" cy="58" r="2.5" fill="#b08d4f" stroke="none"/>
  </g>

  <!-- corner filigree, bottom-right -->
  <g fill="none" stroke="#b08d4f" stroke-width="1.4" transform="rotate(180 150 220)">
    <path d="M18 30v34c0 10 8 18 18 18h10"/>
    <path d="M18 44c8 0 14 6 14 14s-6 14-14 14"/>
    <path d="M34 30c0 8 6 14 14 14s14-6 14-14"/>
    <circle cx="32" cy="58" r="2.5" fill="#b08d4f" stroke="none"/>
  </g>

  <!-- ribbon tails -->
  <g>
    <path d="M126 196l-22 96 34-18 20 20 6-98z" fill="#6d1f2a"/>
    <path d="M176 196l22 96-34-18-20 20-6-98z" fill="#842635"/>
  </g>

  <!-- wax seal -->
  <use href="#seal" fill="#6d1f2a"/>
  <use href="#seal" fill="none" stroke="#4a1119" stroke-width="2"/>
  <circle cx="150" cy="180" r="42" fill="none" stroke="#e9d3a6" stroke-width="1.5" opacity=".85"/>
  <circle cx="150" cy="180" r="34" fill="none" stroke="#e9d3a6" stroke-width="1" opacity=".55" stroke-dasharray="2 4"/>
  <path d="M150 164l10 16-10 16-10-16z" fill="#e9d3a6"/>
  <circle cx="150" cy="180" r="4" fill="#6d1f2a"/>

  <!-- bottom rule -->
  <g stroke="#b08d4f">
    <path d="M18 410h264" stroke-width="1.5"/>
    <path d="M18 405h264" stroke-width=".8"/>
  </g>
</svg>
